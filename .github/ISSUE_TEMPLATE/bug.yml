name: Fehler melden / Report a bug
description: Was ist passiert, und was hast du erwartet? / What happened, and what did you expect?
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Öffentlich, GitHub-Konto nötig. Privat und ohne GitHub: https://turniermanager-beta.pages.dev/de/feedback/
        Keine echten Teilnehmerdaten, vollständigen Backups, Passwörter oder Tokens hochladen. Sicherheitsprobleme bitte privat an hybrid-larval-1l@icloud.com.

        Public, GitHub account required. Private feedback without GitHub: https://turniermanager-beta.pages.dev/en/feedback/
        Do not upload real participant data, full backups, passwords or tokens. Report security issues privately to hybrid-larval-1l@icloud.com.
  - type: textarea
    id: problem
    attributes:
      label: Was wolltest du tun, und was ist passiert? / What were you trying to do, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Was hast du erwartet? / What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte oder Screenshot, freiwillig / Steps or screenshot, optional
      description: Kurze Schritte helfen. Vor Screenshots Teilnehmer- und Kontodaten ausblenden. Keine vollständigen Backups anhängen. / Short steps help. Hide participant and account data in screenshots. Do not attach full backups.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Appversion, falls bekannt / App version, if known
      description: Freiwillig. Einstellungen → Programm / Optional. Settings → Application.
      placeholder: 0.9.0-beta.2
    validations:
      required: false
  - type: input
    id: platform
    attributes:
      label: Betriebssystem, falls bekannt / Operating system, if known
      description: Freiwillig. Windows oder Mac genügt; keine genaue Buildnummer nötig. / Optional. Windows or Mac is enough; no exact build number needed.
      placeholder: Windows / macOS
    validations:
      required: false
