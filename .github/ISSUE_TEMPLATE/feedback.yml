name: Feedback geben / Share feedback
description: Ein paar Sätze reichen. / A few lines are enough.
title: "Feedback zu Turniermanager / Turniermanager feedback"
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Öffentlich, GitHub-Konto nötig. Privat und ohne GitHub: https://turniermanager-beta.pages.dev/de/feedback/
        Keine echten Teilnehmerdaten, vollständigen Backups, Passwörter oder Tokens hochladen. Sicherheitsprobleme bitte privat an hybrid-larval-1l@icloud.com.

        Public, GitHub account required. Private feedback without GitHub: https://turniermanager-beta.pages.dev/en/feedback/
        Do not upload real participant data, full backups, passwords or tokens. Report security issues privately to hybrid-larval-1l@icloud.com.
  - type: textarea
    id: problem
    attributes:
      label: Deine Rückmeldung / Your feedback
      description: Was hat geholfen, war umständlich oder hat nicht funktioniert? / What helped, got in the way or did not work?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Appversion, falls bekannt / App version, if known
      description: Freiwillig. Einstellungen → Programm / Optional. Settings → Application.
      placeholder: 0.9.0-beta.2
    validations:
      required: false
  - type: input
    id: platform
    attributes:
      label: Betriebssystem, falls bekannt / Operating system, if known
      description: Freiwillig. Windows oder Mac genügt; keine genaue Buildnummer nötig. / Optional. Windows or Mac is enough; no exact build number needed.
      placeholder: Windows / macOS
    validations:
      required: false
  - type: dropdown
    id: usage
    attributes:
      label: Freiwillig zur Nutzung / Optional usage context
      options:
        - Lieber keine Angabe / Prefer not to say
        - Nur angesehen / Only looked at it
        - Einen Probelauf gemacht / Completed a practice run
        - Bei einem Turnier verwendet / Used it at a tournament
    validations:
      required: false
  - type: textarea
    id: reuse
    attributes:
      label: Würdest du es wieder nutzen? / Would you use it again?
      description: Freiwillig; eine kurze Begründung hilft. / Optional; a short reason helps.
    validations:
      required: false
